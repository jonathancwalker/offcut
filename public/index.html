<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>Library — Offcut</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23232522' d='M2 2h17v17H2zm19 0h17v17H21zM2 21h17v17H2zm19 0h17L21 38z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/library.css">
</head>
<body class="library-page">
  <header class="app-header">
    <a class="brand" href="/" aria-label="Offcut library"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>offcut</a>
    <nav class="app-nav" aria-label="Main navigation"><a class="nav-link active" href="/" aria-current="page">Library</a><a class="nav-link" href="/study-new.html">Studies</a></nav>
    <div class="header-actions"><a class="primary-button" href="/new.html">New run</a></div>
  </header>
  <main class="library-main">
    <div id="page-error" class="page-error" role="alert" hidden><p id="page-error-message"></p><button id="retry-load" class="text-button">Try again</button></div>
    <section id="active-batches" class="active-batches" aria-labelledby="active-batches-heading" hidden><h2 id="active-batches-heading">Batch in progress</h2><div id="active-batch-list"></div></section>
    <section id="pending-section" class="pending-section" aria-labelledby="pending-heading" hidden><h2 id="pending-heading">In progress</h2><div id="pending-list"></div></section>
    <div class="collection-heading"><h1>Library <span id="run-count">—</span></h1></div>
    <details id="batch-history" class="batch-history" hidden><summary>Batches <span id="batch-history-count"></span></summary><div id="batch-history-list"></div><button id="show-more-batches" class="text-button" type="button" hidden>Show more batches</button></details>
    <div class="collection-toolbar">
      <label class="collection-search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.5 12.5 4 4"/></svg><input id="run-search" type="search" aria-label="Search by work ID, model, or provider" placeholder="Find a work or model" autocomplete="off"></label>
      <label class="sr-only" for="model-filter">Filter by model</label><select id="model-filter"><option value="">All models</option></select>
      <label class="sr-only" for="status-filter">Filter by outcome</label><select id="status-filter"><option value="all">All outcomes</option><option value="completed">Completed</option><option value="archived">Archived</option><option value="limit_reached">Limit reached</option><option value="stopped">Stopped</option><option value="failed">Failed</option><option value="interrupted">Interrupted</option></select>
      <label class="sr-only" for="batch-filter">Filter by batch</label><select id="batch-filter" hidden><option value="">All works</option></select>
      <button id="refresh-runs" class="icon-button" aria-label="Refresh library" title="Refresh library"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.2 7.5A6.5 6.5 0 1 0 16.5 11M16.5 3.5v4.5H12"/></svg></button>
    </div>
    <div id="run-list" class="run-list" aria-label="Saved works"><p class="collection-loading" role="status">Loading works…</p></div>
    <div id="empty-library" class="collection-empty" hidden><p>No finished works yet.</p><a class="text-button" href="/new.html">New run</a></div>
    <div id="no-matches" class="collection-empty" hidden><p>No matching works.</p><button id="clear-filters" class="text-button">Clear filters</button></div>
    <div id="collection-pagination" class="collection-pagination" hidden><span id="visible-count" role="status"></span><button id="show-more-runs" class="secondary-button">Show more</button></div>
    <p id="launch-confirmation" class="sr-only" role="status"></p>
  </main>
  <script type="module" src="/library.js"></script>
</body>
</html>
