<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f6"><title>Study — Offcut</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/study-status.css"></head>
<body class="study-status-page">
  <header class="app-header"><a class="brand" href="/" aria-label="Offcut library"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>offcut</a><nav class="app-nav" aria-label="Main navigation"><a class="nav-link" href="/">Library</a><a class="nav-link active" href="/studies.html" aria-current="page">Studies</a></nav><div class="header-actions"><a class="secondary-button" href="/studies.html">All studies</a></div></header>
  <main class="study-status-main">
    <header class="study-status-heading"><div><a class="back-link" href="/studies.html">← Studies</a><p class="eyebrow" id="study-kind"></p><h1 id="study-title">Study</h1><p id="study-summary" class="study-summary"></p></div><span id="study-status" class="study-status-pill"></span></header>
    <div id="study-error" class="page-error" role="alert" hidden><span id="study-error-message"></span><button id="retry-study" class="text-button" type="button">Try again</button></div>
    <p id="study-loading" class="collection-loading" role="status">Opening study…</p>
    <section id="study-content" hidden>
      <div class="study-launch-card"><div><p class="eyebrow">Next action</p><h2 id="action-title"></h2><p id="action-copy"></p></div><div id="study-actions" class="study-actions"></div></div>
      <div class="study-status-grid"><section><p class="eyebrow">Conditions</p><dl id="study-conditions"></dl></section><section><p class="eyebrow">Progress</p><div id="study-progress" class="study-progress"></div></section></div>
      <section class="study-cells-section"><div class="study-section-heading"><p class="eyebrow">Run queue</p><span id="study-updated"></span></div><div id="study-cells" class="study-cells"></div></section>
    </section>
  </main>
  <script type="module" src="/study-status.js"></script>
</body>
</html>
